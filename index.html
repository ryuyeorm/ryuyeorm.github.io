<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Children's Day!</title>
    <style>
        /* --- BASE STYLES --- */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5; /* Soft pastel pink */
            color: #d6336c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* --- SCREENS --- */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #intro-screen {
            z-index: 10;
        }

        #card-screen {
            opacity: 0;
            visibility: hidden;
            z-index: 5;
        }

        /* --- INTRO SCREEN ELEMENTS --- */
        .envelope-icon {
            font-size: 6rem;
            margin-bottom: 10px;
            animation: gentle-bounce 2s infinite ease-in-out;
        }

        .greeting-text {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: #c2255c;
        }

        .open-btn {
            background-color: #ff87a3;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 135, 163, 0.4);
            transition: all 0.2s ease;
        }

        .open-btn:hover {
            transform: scale(1.05) translateY(-2px);
            background-color: #ff6b8b;
            box-shadow: 0 6px 20px rgba(255, 135, 163, 0.6);
        }

        /* --- 3D FLOATING CARD ELEMENTS --- */
        .card-wrapper {
            perspective: 1500px;
            animation: float 4s infinite ease-in-out;
            cursor: pointer;
        }

        .card-inner {
            /* Sized for a standard landscape photo/card aspect ratio */
            width: 90vw;
            max-width: 700px;
            aspect-ratio: 4 / 3; 
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy, natural flip */
            transform-style: preserve-3d;
        }

        /* The class we add with JavaScript to flip the card */
        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden; /* For Safari */
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            background-color: white;
            border: 8px solid white; /* Gives it a nice physical card border */
            box-sizing: border-box;
        }

        /* The front of the card */
        .card-front {
            /* Image 1.png will be here */
        }

        /* The back of the card */
        .card-back {
            transform: rotateY(180deg);
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the images fill the space perfectly without stretching */
            border-radius: 12px;
        }

        .instruction {
            margin-top: 40px;
            font-size: 1.1rem;
            color: #d6336c;
            opacity: 0.8;
            font-weight: bold;
        }

        /* --- ANIMATIONS --- */
        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }
    </style>
</head>
<body>

    <!-- INTRO SCREEN -->
    <div id="intro-screen" class="screen">
        <div class="envelope-icon">💌</div>
        <div class="greeting-text">A special card is here for you!</div>
        <button class="open-btn" onclick="openCard()">Open Envelope</button>
    </div>

    <!-- CARD SCREEN -->
    <div id="card-screen" class="screen">
        <div class="card-wrapper" onclick="flipCard()">
            <div class="card-inner" id="my-card">
                
                <!-- FRONT OF CARD -->
                <div class="card-face card-front">
                    <img src="1.png" alt="Front of Card" class="card-image">
                </div>
                
                <!-- BACK OF CARD -->
                <div class="card-face card-back">
                    <img src="2.png" alt="Back of Card" class="card-image">
                </div>

            </div>
        </div>
        <div class="instruction">Tap the card to flip it over! ✨</div>
    </div>

    <script>
        // Function to hide the intro screen and show the floating card
        function openCard() {
            document.getElementById('intro-screen').style.opacity = '0';
            document.getElementById('intro-screen').style.visibility = 'hidden';
            
            document.getElementById('card-screen').style.visibility = 'visible';
            document.getElementById('card-screen').style.opacity = '1';
        }

        // Function to flip the card around when clicked
        function flipCard() {
            const card = document.getElementById('my-card');
            card.classList.toggle('is-flipped');
        }
    </script>
</body>
</html>
